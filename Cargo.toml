[package]
name = "awiki"
version = "0.7.1"
edition = "2021"
description = "CLI for exploring and maintaining flat-file Markdown wikis"
license = "MIT"
homepage = "https://github.com/corca-ai/awiki/blob/main/README.md"
repository = "https://github.com/corca-ai/awiki"
rust-version = "1.100"

[dependencies]
globset = "0.4.19"
pulldown-cmark = "0.13.6"
rand = "0.8"
rayon = "1.10"
rustc-hash = "2.1"
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
unicode-normalization = "0.1"

tempfile = "3.14"
github-slugger = "0.1.0"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = true

[profile.dist]
inherits = "release"
lto = "thin"

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "allow"
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
uninlined_format_args = "warn"
cognitive_complexity = "warn"
too_many_lines = "warn"
match_wildcard_for_single_variants = "warn"
